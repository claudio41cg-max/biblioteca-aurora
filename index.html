<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17100c"><link rel="manifest" href="./manifest.webmanifest"><title>Biblioteca Aurora • Estante</title><style>
:root{color-scheme:dark;--gold:#e8bd78;--cream:#f5e9d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#58412a 0%,#1b120e 60%,#0e0a08 100%);color:var(--cream);font-family:Georgia,serif}header{text-align:center;padding:24px 16px 12px}header .eyebrow{font:11px system-ui;letter-spacing:4px;color:var(--gold)}h1{font-size:clamp(30px,7vw,48px);margin:7px 0;font-weight:normal}header p{color:#b7a58d;font:13px system-ui;margin:0}.toolbar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding:18px 10px}.btn{background:#302219;color:#f2d5a4;border:1px solid #8c6742;border-radius:8px;padding:11px 15px;font:600 13px system-ui;cursor:pointer}.btn.primary{background:#c6985e;color:#24160d}.btn:active{transform:scale(.97)}input[type=file]{display:none}.library{max-width:1080px;margin:0 auto;padding:0 15px 50px}.section-title{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-size:18px;font-weight:normal;color:#e7c99c}.section-title:after{content:"";height:1px;background:#74563a;flex:1}.cabinet{background:linear-gradient(90deg,#422918,#684528 5%,#2a190f 11%,#1b100b 50%,#2a190f 89%,#684528 95%,#422918);border:9px solid #6d4829;border-top:12px solid #8a5b34;border-radius:5px;box-shadow:0 22px 35px #000a,inset 0 10px 20px #0009;position:relative;padding:22px 12px 3px}.cabinet:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 5%,#e2a66b20,transparent 65%)}.bookrow{display:flex;gap:7px;align-items:flex-end;overflow-x:auto;min-height:230px;padding:12px 5px 18px;scrollbar-width:thin;scrollbar-color:#8a6342 transparent;perspective:900px}.cover{--c:#5e3646;--c2:#a77b73;position:relative;flex:0 0 132px;height:196px;border:0;padding:0;cursor:pointer;background:transparent;transform-style:preserve-3d;transition:transform .35s,filter .35s;filter:drop-shadow(8px 9px 5px #0009);text-align:center;color:#f7e6c9}.cover:hover,.cover:focus-visible{transform:translateY(-12px) rotateY(-9deg)}.cover:before{content:"";position:absolute;left:-9px;top:4px;width:12px;height:188px;background:linear-gradient(90deg,#140e0b,var(--c),#d5b28c);transform:skewY(-9deg);border-radius:3px 0 0 3px}.face{position:absolute;inset:0;overflow:hidden;border:2px solid #d1aa69;border-radius:3px 8px 8px 3px;background:radial-gradient(ellipse at 70% 24%,var(--c2),transparent 70%),linear-gradient(140deg,var(--c),#211721);box-shadow:inset 7px 0 10px #0008,inset 0 0 0 6px #d5ae6d25,inset 0 0 0 8px #1a100d60}.face:before{content:"";position:absolute;inset:12px;border:1px solid #f1cf8b8c;border-radius:50% 50% 3px 3px}.ornament{position:absolute;top:21px;left:0;right:0;font-size:26px;color:#e4c08b;text-shadow:0 2px 3px #0007}.cover-title{position:absolute;top:69px;left:12px;right:12px;font-size:17px;line-height:1.12;font-weight:bold;text-shadow:0 2px 3px #0009}.cover-author{position:absolute;bottom:19px;left:7px;right:7px;font:10px system-ui;letter-spacing:1px;text-transform:uppercase;color:#ecd2a9}.plank{height:20px;margin:0 -17px -4px;background:linear-gradient(#bb8650 0%,#89562e 35%,#553219 90%);border-top:3px solid #d1a06c;box-shadow:0 11px 16px #000c;position:relative;z-index:1}.note{font:12px system-ui;color:#bba78c;text-align:center;padding:10px}.overlay{display:none;position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at top,#473326,#0b0807 80%);overflow-y:auto;padding:15px}.overlay.show{display:block}.reader-head{max-width:840px;margin:0 auto 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.reader-head h2{font-size:18px;margin:0;text-align:center;font-weight:normal}.stage{max-width:850px;margin:auto;perspective:1400px}.book-open{display:flex;min-height: min(66vh,610px);background:#e9d9b9;color:#34271c;border:10px solid #563322;border-radius:8px 18px 18px 8px;box-shadow:0 18px 40px #000d,inset 0 0 0 3px #ad8756;position:relative;overflow:hidden}.book-open:before{content:"";position:absolute;inset:0 50% 0 auto;width:32px;background:linear-gradient(90deg,transparent,#59412733,transparent);z-index:2;pointer-events:none}.paper{width:50%;padding:clamp(14px,4vw,34px);overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(13px,2.8vw,18px);line-height:1.6;background:linear-gradient(90deg,#e4d2af,#fff5de 12%,#f3e5c9 95%,#d1b78c);position:relative}.paper.right{background:linear-gradient(90deg,#cdb58a,#f7ebd2 10%,#fff5de 92%,#e0cda9)}.paper.flip{animation:turn .5s ease-in-out;transform-origin:left center}@keyframes turn{0%{transform:rotateY(0)}50%{transform:rotateY(-78deg);filter:brightness(.8)}100%{transform:rotateY(0)}}.reader-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:18px auto}.pagecount{font:13px system-ui;color:#d8b98c}.intro{max-width:600px;text-align:center;margin:0 auto 12px;color:#bda78b;font:12px system-ui}@media(max-width:530px){.cabinet{padding:14px 7px 0;border-width:7px}.bookrow{min-height:205px;gap:8px}.cover{flex-basis:113px;height:170px}.cover:before{height:163px}.cover-title{top:60px;font-size:15px}.ornament{font-size:22px}.book-open{min-height:57vh;border-width:6px}.paper{font-size:13px;padding:13px;line-height:1.55}}
</style></head><body><header><div class="eyebrow">ACERVO PARTICULAR</div><h1>✦ Biblioteca Aurora ✦</h1><p>Histórias para guardar. Mundos para descobrir.</p></header><div class="toolbar"><label class="btn primary" for="file">＋ Adicionar meu livro TXT</label><input id="file" type="file" accept=".txt,text/plain"><button class="btn" id="help">Sobre o acervo</button></div><main class="library" id="library"></main><div class="overlay" id="overlay"><div class="reader-head"><button class="btn" id="close">✕ Voltar</button><h2 id="readerTitle"></h2><button class="btn" id="listen">♫ Ouvir</button></div><p class="intro">Arraste a página ou use as setas para folhear. Narração usa a voz do aparelho.</p><div class="stage"><div class="book-open" id="openbook"><div class="paper" id="left"></div><div class="paper right" id="right"></div></div></div><div class="reader-actions"><button class="btn" id="prev">← Anterior</button><span class="pagecount" id="count"></span><button class="btn primary" id="next">Próxima →</button><button class="btn" id="stop">■ Parar áudio</button></div></div><script>
const sections=[{name:'Romances românticos',books:[['Orgulho e Preconceito','Jane Austen'],['Razão e Sensibilidade','Jane Austen'],['A Moreninha','Joaquim M. de Macedo'],['Senhora','José de Alencar']]},{name:'Romances sensuais • adultos',books:[['Entre Velas e Segredos','Conto original'],['Noites de Verão','Conto original'],['Desejo e Distância','Conto original'],['Cartas ao Entardecer','Conto original']]},{name:'Ficção e aventuras',books:[['A Máquina do Tempo','H. G. Wells'],['A Ilha Misteriosa','Jules Verne'],['Viagem ao Centro da Terra','Jules Verne'],['Frankenstein','Mary Shelley']]},{name:'Autores brasileiros',books:[['Dom Casmurro','Machado de Assis'],['Memórias Póstumas','Machado de Assis'],['O Cortiço','Aluísio Azevedo'],['Iracema','José de Alencar']]}];
const palette=[['#613246','#ad6e7b'],['#174c55','#4d9a9c'],['#72552c','#c7a56b'],['#413b6b','#8a78ae'],['#6d302d','#c77c67'],['#244c39','#76a58a']];let texts={},current='',chunks=[],index=0;const demo='Este volume é uma amostra visual da Biblioteca Aurora.\n\nA obra integral ainda não foi adicionada. Esta versão demonstra a experiência de estante e leitura com páginas.\n\nVocê pode importar um livro TXT de sua propriedade pelo botão na biblioteca.\n\nEm futuras versões, serão adicionadas obras completas de domínio público e suporte a EPUB.\n\nBoa leitura!';sections.forEach(s=>s.books.forEach(b=>texts[b[0]]=demo));const saved=JSON.parse(localStorage.getItem('aurora-books')||'{}');Object.assign(texts,saved);function draw(){library.innerHTML='';const all=sections.concat(Object.keys(saved).length?[{name:'Minha coleção',books:Object.keys(saved).map(t=>[t,'Meu arquivo'])}]:[]);all.forEach((s,j)=>{let h=document.createElement('h2');h.className='section-title';h.textContent=s.name;library.append(h);let shelf=document.createElement('div');shelf.className='cabinet';let row=document.createElement('div');row.className='bookrow';s.books.forEach(([t,a],i)=>{let b=document.createElement('button');b.className='cover';let c=palette[(i+j*2)%palette.length];b.style.setProperty('--c',c[0]);b.style.setProperty('--c2',c[1]);b.innerHTML='<span class="face"><span class="ornament">❦</span><span class="cover-title"></span><span class="cover-author"></span></span>';b.querySelector('.cover-title').textContent=t;b.querySelector('.cover-author').textContent=a;b.setAttribute('aria-label','Abrir '+t);b.onclick=()=>open(t);row.append(b)});shelf.append(row);let plank=document.createElement('div');plank.className='plank';shelf.append(plank);library.append(shelf)});let note=document.createElement('p');note.className='note';note.textContent='Os títulos do catálogo são demonstrativos. Importe TXT para ler um livro completo.';library.append(note)}function open(t){current=t;chunks=(texts[t].match(/[\s\S]{1,560}/g)||['']);index=Math.min(Number(localStorage.getItem('aurora-page:'+t)||0),Math.ceil(chunks.length/2)-1);readerTitle.textContent=t;overlay.classList.add('show');document.body.style.overflow='hidden';show()}function show(animate=false){left.textContent=chunks[index*2]||'';right.textContent=chunks[index*2+1]||'';count.textContent=(index*2+1)+'–'+Math.min(index*2+2,chunks.length)+' de '+chunks.length;if(animate){right.classList.remove('flip');void right.offsetWidth;right.classList.add('flip')}localStorage.setItem('aurora-page:'+current,index)}function turn(d){let n=index+d;if(n<0||n>=Math.ceil(chunks.length/2))return;index=n;speechSynthesis.cancel();show(true)}function close(){overlay.classList.remove('show');document.body.style.overflow='';speechSynthesis.cancel()}close.onclick=close;prev.onclick=()=>turn(-1);next.onclick=()=>turn(1);listen.onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(left.textContent+' '+right.textContent);u.lang='pt-BR';u.rate=.9;speechSynthesis.speak(u)};stop.onclick=()=>speechSynthesis.cancel();help.onclick=()=>alert('Biblioteca Aurora: estante demonstrativa com capas estilizadas. Os títulos do catálogo ainda não incluem obras completas. Importe arquivos TXT que você possua para ler e ouvir.');file.onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=f.name.replace(/\.txt$/i,'');let content=await f.text();texts[t]=content;saved[t]=content;try{localStorage.setItem('aurora-books',JSON.stringify(saved))}catch(e){alert('Livro grande demais para guardar no navegador; ele ficará disponível nesta sessão.')}draw();open(t)};let sx=0;openbook.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});openbook.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55)turn(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('show'))return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')close()});draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
