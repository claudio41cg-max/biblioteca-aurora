<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081d1d">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./aurora-estante.css?v=5">
  <title>Biblioteca Aurora • Minha estante</title>
</head>
<body>
  <header class="tophead">
    <p class="eyebrow">ACERVO PARTICULAR</p>
    <h1>Biblioteca <em>Aurora</em></h1>
    <p class="subtitle">Histórias para guardar. Mundos para descobrir.</p>
    <div class="import-area" id="importArea">
      <button class="import-trigger" type="button" id="importTrigger" aria-expanded="false" aria-controls="importMenu">
        <span class="import-plus" aria-hidden="true">＋</span> Importar livros <span aria-hidden="true">⌄</span>
      </button>
      <div class="import-menu" id="importMenu" hidden>
        <label class="menu-label" for="importCategory">Guardar na categoria</label>
        <select id="importCategory">
          <option value="romance">Romances</option>
          <option value="adulto">Romances picantes</option>
          <option value="ficcao">Ficção e aventuras</option>
          <option value="brasileiros">Autores brasileiros</option>
        </select>
        <a href="./meus-livros.html?categoria=romance" class="import-option" id="pdfLink"><span aria-hidden="true">▤</span> Importar livro PDF <span aria-hidden="true">›</span></a>
        <label class="import-option" for="txtFile"><span aria-hidden="true">≡</span> Importar livro TXT <span aria-hidden="true">›</span></label>
        <input id="txtFile" type="file" accept=".txt,text/plain">
      </div>
    </div>
  </header>

  <main class="library" id="library" aria-label="Estantes por categoria"></main>
  <footer class="footnote">Seus livros importados ficam guardados neste aparelho. Toque numa lombada para pegar o volume.</footer>

  <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Leitor de livros em texto" aria-hidden="true">
    <div class="reader-head">
      <button class="btn" id="close" type="button">← Estante</button>
      <h2 id="readerTitle"></h2>
      <button class="btn" id="listen" type="button">♫ Ouvir</button>
    </div>
    <p class="reader-intro">Arraste a página ou use as setas para folhear. A narração usa a voz do aparelho.</p>
    <div class="stage"><div class="book-open" id="openbook">
      <div class="paper" id="left"></div><div class="paper right" id="right"></div>
    </div></div>
    <div class="reader-actions">
      <button class="btn" id="prev" type="button">← Anterior</button>
      <span class="pagecount" id="count"></span>
      <button class="btn" id="next" type="button">Próxima →</button>
      <button class="btn" id="stop" type="button">■ Parar áudio</button>
    </div>
  </section>
  <script src="./aurora-estante.js" defer></script>
  <script src="./aurora-importados.js" defer></script>
</body>
</html>
