<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26180f"><link rel="manifest" href="manifest.webmanifest"><title>Biblioteca Aurora</title><style>body{margin:0;background:#20150f;color:#f6e5c8;font-family:Georgia,serif}header{padding:24px;text-align:center;background:#382416}h1{margin:0;color:#f6d99c}small{color:#d3b78c}main{max-width:900px;margin:auto;padding:16px}.shelf{margin:25px 0;padding:12px;background:linear-gradient(#51351e,#29190f);border-bottom:18px solid #9b6435;box-shadow:0 12px 12px #0009;border-radius:8px}.books{display:flex;gap:10px;overflow-x:auto;padding:14px 4px}.book{flex:0 0 110px;height:170px;border:2px solid #c7a66d;border-radius:3px 9px 9px 3px;color:white;box-shadow:5px 6px 7px #0009,inset 7px 0 #0005;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer;font: bold 15px Georgia}.book:nth-child(4n+1){background:#743d52}.book:nth-child(4n+2){background:#174b56}.book:nth-child(4n+3){background:#66502e}.book:nth-child(4n){background:#4c3f6d}button,.action{background:#b88a4e;color:#1d140d;border:0;border-radius:7px;padding:12px;margin:5px;cursor:pointer;font-weight:bold}#reader{display:none;position:fixed;inset:0;background:#25180f;z-index:5;overflow:auto;padding:15px}#paper{max-width:600px;min-height:60vh;margin:15px auto;background:#f7eed9;color:#332619;border-radius:5px 17px 17px 5px;padding:30px;box-shadow:inset 15px 0 25px #8d775d55,8px 8px 15px #0009;line-height:1.8;font-size:20px;transition:transform .3s;white-space:pre-wrap}#controls{text-align:center}#title{text-align:center}label{display:inline-block;padding:10px}input{max-width:100%}</style></head><body><header><h1>📚 Biblioteca Aurora</h1><small>Sua estante, suas histórias</small></header><main><p>Toque em um livro para abrir. Importe um texto seu para ler offline.</p><label class="action">📥 Importar TXT <input id="file" type="file" accept=".txt,text/plain" hidden></label><div id="shelves"></div></main><section id="reader"><div id="controls"><button onclick="closeBook()">✕ Fechar</button><button onclick="speak()">🔊 Ouvir</button><button onclick="speechSynthesis.cancel()">■ Parar</button></div><h2 id="title"></h2><article id="paper"></article><div id="controls"><button onclick="page(-1)">◀ Anterior</button><span id="count"></span><button onclick="page(1)">Próxima ▶</button></div></section><script>const groups=[["Romances românticos",["Orgulho e Preconceito","Razão e Sensibilidade","A Moreninha","Senhora"]],["Romances sensuais (adultos)",["Entre Velas e Segredos","Noites de Verão","Desejo e Distância","Cartas ao Entardecer"]],["Ficção",["A Máquina do Tempo","A Ilha Misteriosa","Viagem ao Centro da Terra","Frankenstein"]],["Autores brasileiros",["Dom Casmurro","Memórias Póstumas de Brás Cubas","O Cortiço","Iracema"]]];let books={},current='',pages=[],p=0;const intro="Esta é uma demonstração da Biblioteca Aurora. A obra completa ainda não está incluída. Você pode importar seus próprios arquivos TXT para ler aqui. Livros de domínio público serão adicionados em versões futuras.\n\n";groups.forEach(([g,n])=>n.forEach(t=>books[t]=intro+t+"\n\nUma biblioteca para descobrir novas histórias e guardar suas leituras."));function render(){shelves.innerHTML='';groups.concat([["Meus livros",Object.keys(books).filter(x=>!groups.some(g=>g[1].includes(x)))]]).forEach(([name,items])=>{if(!items.length)return;let s=document.createElement('section');s.className='shelf';let h=document.createElement('h2');h.textContent=name;s.append(h);let b=document.createElement('div');b.className='books';items.forEach(t=>{let e=document.createElement('button');e.className='book';e.textContent=t;e.onclick=()=>openBook(t);b.append(e)});s.append(b);shelves.append(s)})}function openBook(t){current=t;pages=(books[t].match(/[\s\S]{1,850}/g)||['']);p=0;title.textContent=t;reader.style.display='block';show()}function show(){paper.style.transform='rotateY(12deg)';setTimeout(()=>paper.style.transform='',130);paper.textContent=pages[p];count.textContent=(p+1)+' / '+pages.length;localStorage.setItem('aurora:'+current,p)}function page(d){let n=p+d;if(n<0||n>=pages.length)return;p=n;speechSynthesis.cancel();show()}function closeBook(){reader.style.display='none';speechSynthesis.cancel()}function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(paper.textContent);u.lang='pt-BR';speechSynthesis.speak(u)}file.onchange=async e=>{let f=e.target.files[0];if(!f)return;books[f.name.replace(/\.txt$/i,'')]=await f.text();render();openBook(f.name.replace(/\.txt$/i,''))};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
