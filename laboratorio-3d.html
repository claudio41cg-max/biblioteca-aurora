<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora • laboratório 3D</title><style>html,body{margin:0;height:100%;background:#110c09;color:#f1dec0;font-family:Georgia,serif;overflow:hidden}canvas{display:block}#top{position:absolute;top:0;left:0;right:0;text-align:center;padding:18px 10px;background:linear-gradient(#110c09df,transparent);pointer-events:none}h1{font-weight:normal;font-size:26px;margin:0}p{margin:6px;font:12px system-ui;color:#c9b69a}#bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:14px;background:linear-gradient(transparent,#110c09f2)}button{background:#b58a55;border:1px solid #e7c28e;border-radius:7px;padding:12px;color:#1c120a;font-weight:bold}#detail{display:none;position:absolute;inset:0;background:#110c09ee;z-index:5;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:15px}#detail.on{display:flex}#volume{position:relative;width:190px;height:265px;transform-style:preserve-3d;perspective:900px;filter:drop-shadow(12px 18px 12px #000)}#volume .back{position:absolute;inset:0;background:#f4e4bd;border:8px solid #57382a;border-radius:5px 15px 15px 5px}#volume .front{position:absolute;inset:0;background:linear-gradient(120deg,#704b4e,#261b2e);border:5px double #dbbb78;border-radius:5px 12px 12px 5px;transform-origin:left;transition:transform 1s;display:flex;align-items:center;justify-content:center;padding:14px;font-size:22px}#volume.open .front{transform:rotateY(-150deg)}#page{max-width:340px;line-height:1.5;color:#e9d8b9;font-size:15px;min-height:50px}#back{position:absolute;top:12px;left:12px;z-index:6}#hint{position:absolute;top:80px;left:0;right:0;text-align:center;font:12px system-ui;color:#d7bd98;pointer-events:none}</style></head><body><div id="top"><h1>Biblioteca Aurora · 3D</h1><p>Laboratório visual em WebGL, separado da biblioteca atual</p></div><div id="hint">Deslize para girar a estante. Toque em um livro.</div><div id="bar"><button id="left">◀ Girar</button><button id="right">Girar ▶</button><button onclick="location.href='./'">Biblioteca atual</button></div><div id="detail"><button id="back">✕ Voltar</button><h2 id="name"></h2><div id="volume"><div class="back"></div><div class="front" id="front"></div></div><div id="page">Toque em abrir para ver o livro em movimento.</div><button id="toggle">Abrir livro</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#140d09');scene.fog=new THREE.Fog('#140d09',12,28);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,2.2,10);camera.lookAt(0,1.1,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe5b8,0x25150e,2.1));const light=new THREE.SpotLight(0xffcf8e,80,25,Math.PI/4,.5);light.position.set(-3,8,6);light.castShadow=true;scene.add(light);
const wood=new THREE.MeshStandardMaterial({color:0x6c3e20,roughness:.68});const woodLight=new THREE.MeshStandardMaterial({color:0x96603a,roughness:.58});function cube(w,h,d,x,y,z,mat,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}const shelf=new THREE.Group();scene.add(shelf);cube(7.8,.28,1.6,0,-.35,0,woodLight,shelf);cube(7.8,.28,1.6,0,1.75,0,woodLight,shelf);cube(7.8,.28,1.6,0,3.85,0,woodLight,shelf);cube(.27,4.6,1.65,-3.94,1.75,0,wood,shelf);cube(.27,4.6,1.65,3.94,1.75,0,wood,shelf);cube(7.7,4.4,.16,0,1.75,-.75,wood,shelf);const books=[];const titles=['Orgulho e Preconceito','A Moreninha','Senhora','Noites de Verão','Desejo e Distância','Frankenstein','A Máquina do Tempo','Iracema','Dom Casmurro','O Cortiço','A Ilha Misteriosa','Razão e Sensibilidade'];const colors=[0x7b3d50,0x2e6770,0x9b623c,0x64446e,0x913c43,0x425b70,0x526447,0x9c7942];function label(text,color){let c=document.createElement('canvas');c.width=256;c.height=512;let g=c.getContext('2d');g.fillStyle='#'+color.toString(16).padStart(6,'0');g.fillRect(0,0,256,512);g.strokeStyle='#e7c78a';g.lineWidth=5;g.strokeRect(18,20,220,472);g.lineWidth=1;g.strokeRect(28,30,200,452);g.fillStyle='#f9dfac';g.textAlign='center';g.font='28px Georgia';g.fillText('❦',128,100);g.font='bold 24px Georgia';let words=text.split(' '),lines=[],line='';for(let w of words){if((line+' '+w).length>16){lines.push(line);line=w}else line=(line+' '+w).trim()}lines.push(line);lines.forEach((v,i)=>g.fillText(v,128,200+i*34));g.font='17px Georgia';g.fillText('BIBLIOTECA AURORA',128,440);let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshStandardMaterial({map:t,roughness:.8})}
titles.forEach((t,i)=>{const row=Math.floor(i/6),slot=i%6,x=-3.1+slot*1.22,y=row?2.85:.75,col=colors[i%colors.length];let group=new THREE.Group();group.position.set(x,y,.2);shelf.add(group);let cover=label(t,col);cube(.91,1.72,.17,0,0,0,new THREE.MeshStandardMaterial({color:col,roughness:.8}),group);cube(.91,1.72,.02,0,0,.11,cover,group);cube(.81,1.57,.13,0,0,-.01,new THREE.MeshStandardMaterial({color:0xe4d7bd}),group);cube(.13,1.72,.25,-.46,0,0,new THREE.MeshStandardMaterial({color:col}),group);group.rotation.z=(i%4-1.5)*.025;books.push({group,title:t})});
let rot=0,target=0,drag=false,sx=0,dist=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;dist=0;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let d=e.clientX-sx;sx=e.clientX;dist+=Math.abs(d);target+=d*.006});renderer.domElement.addEventListener('pointerup',e=>{drag=false;if(dist>12)return;const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(books.map(b=>b.group),true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!books.some(b=>b.group===obj))obj=obj.parent;let book=books.find(b=>b.group===obj);if(book)open(book.title)}});left.onclick=()=>target-=.25;right.onclick=()=>target+=.25;function open(t){name.textContent=t;front.textContent=t;detail.classList.add('on');volume.classList.remove('open');toggle.textContent='Abrir livro';page.textContent='Prévia 3D. O texto completo ainda não foi integrado.'}toggle.onclick=()=>{volume.classList.toggle('open');toggle.textContent=volume.classList.contains('open')?'Fechar livro':'Abrir livro'};back.onclick=()=>detail.classList.remove('on');function animate(){requestAnimationFrame(animate);rot+=(target-rot)*.07;shelf.rotation.y=rot;renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
