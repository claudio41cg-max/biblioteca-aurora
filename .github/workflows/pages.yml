name: Publicar Biblioteca Aurora no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biblioteca-aurora-pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar site estático
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão principal
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos da Biblioteca Aurora
        run: |
          mkdir -p site
          git archive HEAD | tar -x -C site
          rm -rf site/.github site/tests site/.vercel site/node_modules
          rm -f site/README.md site/package.json site/package-lock.json site/PREVIEW-INFO.txt
          find site -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -delete

      - name: Enviar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publicar site principal
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar Biblioteca Aurora
        id: deployment
        uses: actions/deploy-pages@v4
