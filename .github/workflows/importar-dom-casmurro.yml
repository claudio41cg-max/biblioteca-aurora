name: Importar Dom Casmurro (dominio publico)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/importar-dom-casmurro.yml'
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Baixar texto integral do Project Gutenberg
        run: |
          mkdir -p livros
          curl --fail --location --retry 3 --max-time 90 'https://raw.githubusercontent.com/Insper/cd19/master/aula08_bayes/textos/pg55752_domcasmurro.txt' -o livros/dom-casmurro.txt
          test "$(wc -c < livros/dom-casmurro.txt)" -gt 100000
      - name: Salvar texto no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add livros/dom-casmurro.txt
          git diff --cached --quiet || (git commit -m 'Importar Dom Casmurro em dominio publico' && git push)
