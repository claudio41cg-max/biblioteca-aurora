name: Testes automatizados

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, corrigir-identificacao-lombadas-v111]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test
