name: Testes automatizados

on:
  pull_request:
    branches: [main, corrigir-identificacao-lombadas-v111]
  push:
    branches: [main, corrigir-identificacao-lombadas-v111, teste-desfragmentacao-cinematografica-v112]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm run test:catalogo && npm run test:desfragmentacao


  preview-package:
    name: Pacote de prévia Android
    needs: node-tests
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/corrigir-identificacao-lombadas-v111' || github.ref == 'refs/heads/teste-desfragmentacao-cinematografica-v112')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código revisado
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar pacote estático
        run: |
          mkdir -p preview-site
          git archive HEAD | tar -x -C preview-site
          rm -rf preview-site/.github preview-site/tests preview-site/.vercel
          find preview-site -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -delete
          printf 'Biblioteca Aurora v112\\nCommit: %s\\nBranch: %s\\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > preview-site/PREVIEW-INFO.txt
      - name: Publicar pacote de prévia
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-aurora-v112-desfragmentacao-lab
          path: preview-site/
          if-no-files-found: error
          retention-days: 7


  deploy-lab-pages:
    name: Publicar laboratório temporário no GitHub Pages
    needs: node-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/teste-desfragmentacao-cinematografica-v112'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do laboratório
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar somente a bancada de teste
        run: |
          mkdir -p site
          cp teste-desfragmentacao.html site/index.html
          cp teste-desfragmentacao.html site/teste-desfragmentacao.html
          cp aurora-exclusao-particulas.js site/
          cp aurora-exclusao-particulas.css site/
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar bancada temporária
        id: deployment
        uses: actions/deploy-pages@v4
