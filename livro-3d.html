<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora — Livro experimental</title><style>html,body{margin:0;height:100%;background:#100b09;color:#f6e5c7;font-family:Georgia,serif;overflow:hidden}#scene{position:absolute;inset:0}header{position:absolute;top:0;width:100%;text-align:center;padding:14px 0;background:linear-gradient(#100b09d9,transparent);pointer-events:none}h1{font-size:24px;font-weight:normal;margin:4px}header p{font:12px system-ui;color:#b9a38c;margin:5px}.controls{position:absolute;bottom:0;left:0;right:0;padding:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,#100b09ef)}button{background:#b9915b;border:1px solid #e3c38c;border-radius:8px;padding:12px;color:#1a100a;font-weight:700;cursor:pointer}button:disabled{opacity:.4}#status{position:absolute;top:85px;text-align:center;width:100%;font:13px system-ui;color:#dfc29b;pointer-events:none}#caption{position:absolute;bottom:92px;width:100%;text-align:center;color:#c9ae86;font:12px system-ui;pointer-events:none} #readingLayer{position:fixed;inset:0;z-index:20;display:none;background:#160e0a;opacity:0;transition:opacity .45s}#readingLayer.active{display:block;opacity:1}#readingFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#160e0a}#exitReader{position:absolute;top:12px;right:12px;z-index:22;border-radius:50%;width:43px;height:43px;padding:0;background:#3c281cdd;color:#f5dfbb;border:1px solid #ad8959;font:25px system-ui}#readingLabel{position:absolute;z-index:22;left:14px;top:16px;font:12px system-ui;color:#dfc5a1;pointer-events:none} </style></head><body><div id="scene"></div><header><h1>Biblioteca Aurora</h1><p>Capa 3D e folheio com curvatura realista</p></header><div id="status">Arraste para girar o livro</div><div id="caption">Livro interativo • seu progresso fica salvo neste aparelho</div><div class="controls" style="display:none"><button id="open">Abrir capa</button><button id="prev">◀ Folha</button><button id="next">Folha ▶</button><button id="reset">Fechar</button></div><div id="gestureHelp" style="position:absolute;bottom:18px;left:16px;right:16px;text-align:center;font:13px system-ui;color:#dfc9a9;pointer-events:none">Arraste para girar o livro • toque para abrir e folhear</div><div id="readingLayer"><iframe id="readingFrame" title="Folheio realista da Biblioteca Aurora" loading="lazy"></iframe><span id="readingLabel">Biblioteca Aurora · leitura</span><button id="exitReader" aria-label="Fechar livro">×</button></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color('#100b09');const camera=new T.PerspectiveCamera(39,innerWidth/innerHeight,.1,100);camera.position.set(0,0.4,9.5);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.querySelector('#scene').append(renderer.domElement);
scene.add(new T.AmbientLight(0xffdfbd,1.5));let key=new T.DirectionalLight(0xffddaa,4);key.position.set(-3,5,7);scene.add(key);let fill=new T.DirectionalLight(0xa4b3ff,1.4);fill.position.set(4,1,-4);scene.add(fill);
function tex(kind){let c=document.createElement('canvas');c.width=512;c.height=768;let x=c.getContext('2d');if(kind==='cover'){x.fillStyle='#384d4b';x.fillRect(0,0,512,768);for(let i=0;i<10000;i++){let a=Math.random()*512,b=Math.random()*768;x.fillStyle='rgba(240,220,170,'+(Math.random()*.09)+')';x.fillRect(a,b,1,Math.random()*4)}x.strokeStyle='#d7b875';x.lineWidth=7;x.strokeRect(28,28,456,712);x.lineWidth=2;x.strokeRect(43,43,426,682);x.textAlign='center';x.fillStyle='#e9c785';x.font='50px Georgia';x.fillText('❦',256,160);x.font='bold 47px Georgia';x.fillText('DOM',256,305);x.fillText('CASMURRO',256,368);x.font='27px Georgia';x.fillText('MACHADO DE ASSIS',256,580);x.font='18px Georgia';x.fillText('BIBLIOTECA AURORA',256,680)}else{ x.fillStyle='#f4e8ce';x.fillRect(0,0,512,768);x.fillStyle='#3e3025';x.textAlign='center';x.font='22px Georgia';x.fillText('DOM CASMURRO',256,85);x.font='17px Georgia';let lines=['Uma demonstração de páginas','em um livro tridimensional.','','A folha se curva durante','o movimento e muda de lado.','','A obra integral ainda não','foi integrada a este teste.'];lines.forEach((s,i)=>x.fillText(s,256,185+i*45));x.fillText('❦',256,680)}let t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
const fabric=new T.MeshStandardMaterial({color:0x3d5550,roughness:.92,metalness:.02});const gold=new T.MeshStandardMaterial({color:0xc8a66b,metalness:.7,roughness:.3});const paper=new T.MeshStandardMaterial({color:0xf0dfbd,roughness:.95,side:T.DoubleSide});const ink=new T.MeshStandardMaterial({map:tex('page'),side:T.DoubleSide,roughness:.9});const covermat=new T.MeshStandardMaterial({map:tex('cover'),roughness:.85,side:T.DoubleSide});
const book=new T.Group();scene.add(book);book.rotation.y=-.25;function block(w,h,d,x,y,z,mat,parent=book){let m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
const W=2.5,H=3.55;block(W,H,.36,0,0,-.12,paper);for(let i=0;i<150;i++){const tone=i%7===0?0xb6a587:i%3===0?0xd4c3a4:0xeaddc7;block(W-.085,.002,.35,0,-H/2+.014+i*.0232,-.12,new T.MeshStandardMaterial({color:tone,roughness:1}))}const edgeCanvas=document.createElement('canvas');edgeCanvas.width=64;edgeCanvas.height=512;const ec=edgeCanvas.getContext('2d');ec.fillStyle='#e9d8b8';ec.fillRect(0,0,64,512);for(let i=0;i<512;i+=2){ec.fillStyle=i%8===0?'#a8987a':'#d6c5a6';ec.fillRect(0,i,64,1)}const edgeTex=new T.CanvasTexture(edgeCanvas);edgeTex.colorSpace=T.SRGBColorSpace;block(.022,H-.13,.34,W/2-.03,0,-.12,new T.MeshStandardMaterial({map:edgeTex,roughness:1}));
const back=new T.Group();book.add(back);block(W+.12,H+.12,.09,0,0,-.36,fabric,back);block(.15,H+.12,.48,-W/2-.03,0,-.12,fabric);for(let y of [-1.52,1.52])block(W-.15,.018,.025,0,y,.09,gold);
const hinge=new T.Group();hinge.position.set(-W/2,0,.16);book.add(hinge);block(W+.13,H+.13,.09,W/2,0,0,fabric,hinge);let art=new T.Mesh(new T.PlaneGeometry(W-.05,H-.05),covermat);art.position.set(W/2,0,.051);hinge.add(art);const rim=new T.Mesh(new T.BoxGeometry(W+.16,H+.16,.02),gold);rim.position.set(W/2,0,-.06);hinge.add(rim);
let sheets=[];for(let i=0;i<8;i++){let mesh=new T.Mesh(new T.PlaneGeometry(W-.13,H-.15,48,20),new T.MeshStandardMaterial({map:pageTexture(i),side:T.DoubleSide,roughness:.96}));mesh.position.set(-W/2+.08,0,.125+i*.006);mesh.geometry.translate((W-.13)/2,0,0);book.add(mesh);sheets.push({mesh,angle:0,target:0,turn:0})}function pageTexture(i){let c=document.createElement('canvas');c.width=512;c.height=768;let g=c.getContext('2d');g.fillStyle='#f6ebd5';g.fillRect(0,0,512,768);g.fillStyle='#594733';g.textAlign='center';g.font='22px Georgia';g.fillText('DOM CASMURRO',256,90);g.font='17px Georgia';let lines=['Capítulo '+(i+1),'','Este é um protótipo visual da','Biblioteca Aurora.','', 'O movimento das folhas agora','acompanha o gesto do dedo.','','Cada página tem sua própria','numeração e textura.','','Em breve, o texto completo','substituirá esta demonstração.'];lines.forEach((v,k)=>g.fillText(v,256,165+k*36));g.fillText(String(i+1),256,708);let t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t}
let openAngle=0,targetOpen=0,drag=false,lastX=0,rotTarget=-.25,leaf=0,startX=0,startY=0,totalX=0;const progressKey='aurora-dom-casmurro-page';const readingLayer=document.getElementById('readingLayer'),readingFrame=document.getElementById('readingFrame'),exitReader=document.getElementById('exitReader');let readerTimer=null;function enterReading(){if(readingLayer.classList.contains('active'))return;targetOpen=-Math.PI*.85;statusEl.textContent='Abrindo livro...';clearTimeout(readerTimer);readerTimer=setTimeout(()=>{if(!readingFrame.src)readingFrame.src='./folheio-realista.html?v=2';readingLayer.classList.add('active');statusEl.textContent='Toque no livro para abrir'},650)}function leaveReading(){readingLayer.classList.remove('active');targetOpen=0;rotTarget=-.25;clearTimeout(readerTimer);statusEl.textContent='Toque no livro para abrir • arraste para girar'}exitReader.addEventListener('click',leaveReading);const statusEl=document.getElementById('status'),openBtn=document.getElementById('open'),nextBtn=document.getElementById('next'),prevBtn=document.getElementById('prev'),resetBtn=document.getElementById('reset');function bend(mesh,amount){const p=mesh.geometry.attributes.position;const a=Math.max(0,Math.min(1,amount)),curve=Math.sin(Math.PI*a);for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),u=Math.max(0,x/(W-.13));const displacement=.23*Math.sin(Math.PI*u)*curve*(.7+.3*Math.cos(y/H*Math.PI));p.setZ(i,displacement)}p.needsUpdate=true;mesh.geometry.computeVertexNormals()}
openBtn.onclick=()=>{targetOpen=-Math.PI*.87;statusEl.textContent='Livro aberto: deslize para virar folhas'};resetBtn.onclick=()=>{targetOpen=0;leaf=0;sheets.forEach(s=>s.target=0);statusEl.textContent='Livro fechado'};nextBtn.onclick=()=>{targetOpen=-Math.PI*.87;if(leaf<sheets.length){sheets[leaf].target=-Math.PI*.92;leaf++;localStorage.setItem(progressKey,leaf)}statusEl.textContent='Página '+(leaf+1)+' de '+(sheets.length+1)};prevBtn.onclick=()=>{if(leaf>0){leaf--;sheets[leaf].target=0;localStorage.setItem(progressKey,leaf)}statusEl.textContent='Folha '+leaf+' de '+sheets.length};
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=startX=e.clientX;startY=e.clientY;totalX=0;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX;lastX=e.clientX;totalX+=Math.abs(dx);if(targetOpen===0){rotTarget+=dx*.008}else if(Math.abs(e.clientX-startX)>12){const fraction=Math.max(-1,Math.min(1,(startX-e.clientX)/(innerWidth*.55)));if(fraction>0&&leaf<sheets.length){sheets[leaf].angle=-Math.PI*.92*fraction;sheets[leaf].mesh.rotation.y=sheets[leaf].angle;bend(sheets[leaf].mesh,fraction)}else if(fraction<0&&leaf>0){sheets[leaf-1].angle=-Math.PI*.92*(1+fraction);sheets[leaf-1].mesh.rotation.y=sheets[leaf-1].angle;bend(sheets[leaf-1].mesh,1+fraction)}}});
renderer.domElement.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const dx=e.clientX-startX,dy=e.clientY-startY;if(targetOpen===0){if(Math.abs(dx)<18&&Math.abs(dy)<18)enterReading();return}if(dx< -45)nextBtn.click();else if(dx>45)prevBtn.click();else if(Math.abs(dx)<18&&Math.abs(dy)<18){if(e.clientX<innerWidth*.28)prevBtn.click();else if(e.clientX>innerWidth*.72)nextBtn.click();else if(leaf===0&&targetOpen!==0){resetBtn.click()}}});
renderer.domElement.addEventListener('pointercancel',()=>drag=false);
const last=Number(localStorage.getItem(progressKey)||0);statusEl.textContent='Toque no livro para abrir • arraste para girar'
function frame(){requestAnimationFrame(frame);openAngle+=(targetOpen-openAngle)*.065;hinge.rotation.y=openAngle;book.rotation.y+=(rotTarget-book.rotation.y)*.06;for(let i=0;i<sheets.length;i++){const s=sheets[i];if(!(drag&&targetOpen!==0)){s.angle+=(s.target-s.angle)*.085;s.mesh.rotation.y=s.angle;bend(s.mesh,Math.abs(s.angle)/Math.PI)}s.mesh.position.z=.14+(s.angle<-.45?-.004*i:.004*(sheets.length-i));s.mesh.renderOrder=s.angle<-.45?i:sheets.length-i}renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
