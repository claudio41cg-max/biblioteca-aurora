<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241610"><title>Leitura EPUB • Biblioteca Aurora</title><link rel="stylesheet" href="./aurora-novos-leitores.css?v=1"></head><body>
<header class="reader-top"><a class="button" href="./index.html?v=22">← Estante</a><h1 id="bookTitle">Abrindo livro…</h1><button type="button" id="bookmark" title="Marcar página" aria-label="Marcar página">♧</button><button type="button" id="settingsButton" aria-controls="settings" aria-expanded="false">Aa</button></header>
<div class="page-progress"><input id="progress" type="range" min="0" max="100" value="0" aria-label="Progresso da leitura"><output id="progressPercent">0%</output></div>
<nav class="chapter-tools" aria-label="Capítulos"><button id="previousChapter" type="button">← Capítulo</button><small id="chapterLabel">Preparando páginas…</small><button id="nextChapter" type="button">Capítulo →</button></nav>
<main class="reader-stage"><div id="epubFlip" class="flip-host" aria-label="Páginas do livro"></div></main>
<footer class="reader-bottom"><span id="pageLabel">Deslize o canto da página para folhear.</span><div><button type="button" id="readAloud">♫ Ouvir o texto</button></div></footer>
<section class="settings" id="settings" hidden role="dialog" aria-modal="true" aria-label="Personalizar leitura"><div class="settings-card"><div class="settings-head"><h2>Personalizar leitura</h2><button type="button" id="closeSettings">Fechar</button></div><label class="setting-row">Modelo de letra <select id="fontChoice"><option value="Georgia">Georgia</option><option value="Palatino Linotype">Palatino</option><option value="Garamond">Garamond</option><option value="Times New Roman">Times New Roman</option><option value="Arial">Arial</option><option value="Verdana">Verdana</option></select></label><label class="setting-row">Tamanho do texto <input id="fontSize" type="range" min="14" max="28" step="1" value="18"><output id="sizeValue">18</output></label><p>Ambiente de leitura</p><div class="theme-controls"><button type="button" data-theme="light">Claro</button><button type="button" data-theme="sepia">Sépia</button><button type="button" data-theme="night">Noturno</button></div><p class="setting-help">O EPUB adapta o texto ao tamanho escolhido, preservando o efeito de virar folhas. O progresso fica salvo neste aparelho.</p></div></section>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script src="./vendor/jszip.min.js"></script><script src="./aurora-formatos.js?v=1"></script><script src="./aurora-epub-reader.js?v=1"></script>
</body></html>
