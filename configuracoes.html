<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b1b">
  <link rel="stylesheet" href="./aurora-configuracoes.css?v=1">
  <title>Configurações • LIBRIA - BOOK</title>
</head>
<body class="config-page">
  <main class="config-shell">
    <header class="config-header">
      <a class="config-back" href="./index.html" aria-label="Voltar para a estante">‹</a>
      <div><h1>Configurações</h1><p>LIBRIA - BOOK · Seu espaço, do seu jeito</p></div>
    </header>

    <section aria-labelledby="profileHeading">
      <h2 class="config-label" id="profileHeading">Seu perfil</h2>
      <div class="config-card config-profile">
        <div class="config-icon" aria-hidden="true">♙</div>
        <div>
          <label for="profileName">Seu nome</label>
          <div class="config-name-row">
            <input id="profileName" type="text" maxlength="48" autocomplete="name" placeholder="Digite seu nome">
            <button class="config-save" id="saveName" type="button">Salvar</button>
          </div>
        </div>
        <p class="config-note" id="nameStatus">Ainda sem nome. Você pode adicionar ou alterar quando quiser.</p>
      </div>
    </section>

    <section aria-labelledby="localeHeading">
      <h2 class="config-label" id="localeHeading">Preferências</h2>
      <div class="config-card config-profile libria-profile-preferences">
        <label for="profileCountry">País</label>
        <select id="profileCountry"><option value="BR">Brasil</option><option value="PT">Portugal</option><option value="US">Estados Unidos</option><option value="OTHER">Outro</option></select>
        <label for="profileLanguage">Idioma</label>
        <select id="profileLanguage"><option value="pt-BR">Português (Brasil)</option><option value="pt-PT">Português (Portugal)</option><option value="en">English</option><option value="es">Español</option></select>
        <p class="config-note">Preferências salvas neste aparelho nesta versão de protótipo.</p>
      </div>
    </section>

    <section aria-labelledby="shelvesHeading">
      <h2 class="config-label" id="shelvesHeading">Estantes</h2>
      <div class="config-card config-options">
        <button class="config-option" type="button" id="newShelf">
          <span class="config-option-icon" aria-hidden="true">＋</span>
          <span class="config-option-text"><strong>Nova estante</strong><small>Criar uma estante vazia neste app</small></span>
          <span class="config-arrow" aria-hidden="true">›</span>
        </button>
        <button class="config-option" type="button" id="customizeShelf">
          <span class="config-option-icon" aria-hidden="true">✧</span>
          <span class="config-option-text"><strong>Personalizar estante</strong><small>Continuar editando uma das suas estantes</small></span>
          <span class="config-arrow" aria-hidden="true">›</span>
        </button>
      </div>
      <h2 class="config-label" id="savedShelvesHeading" hidden>Suas estantes criadas</h2>
      <div class="config-card config-options" id="savedShelves" hidden></div>
      <p class="config-feedback" id="actionStatus" role="status" aria-live="polite"></p>
    </section>

    <button class="config-done" type="button" onclick="location.href='./index.html'">Voltar para a estante</button>
  </main>
  <script src="./aurora-estantes-salvas.js?v=1"></script>
  <script>
    (() => {
      const key = 'aurora-perfil-nome';
      const profileKey = 'libria-profile-v1';
      const input = document.getElementById('profileName');
      const country = document.getElementById('profileCountry');
      const language = document.getElementById('profileLanguage');
      let profile = {};
      try { profile = JSON.parse(localStorage.getItem(profileKey) || '{}') || {}; } catch (_) {}
      country.value = profile.country || 'BR';
      language.value = profile.language || 'pt-BR';
      const status = document.getElementById('nameStatus');
      const actionStatus = document.getElementById('actionStatus');
      try {
        const saved = localStorage.getItem(key) || '';
        input.value = saved;
        if (saved) status.textContent = 'Nome salvo neste aparelho. Você pode alterar quando quiser.';
      } catch (_) {}
      document.getElementById('saveName').addEventListener('click', () => {
        const name = input.value.trim();
        try {
          if (name) localStorage.setItem(key, name);
          else localStorage.removeItem(key);
          profile = {...profile,name,country:country.value,language:language.value,setupComplete:true};
          localStorage.setItem(profileKey,JSON.stringify(profile));
          status.textContent = name ? 'Perfil salvo neste aparelho.' : 'Preferências salvas neste aparelho.';
        } catch (_) {
          status.textContent = 'Não foi possível salvar neste aparelho.';
        }
      });
      country.addEventListener('change',()=>{profile={...profile,country:country.value,language:language.value};try{localStorage.setItem(profileKey,JSON.stringify(profile));}catch(_){}});
      language.addEventListener('change',()=>{profile={...profile,country:country.value,language:language.value};try{localStorage.setItem(profileKey,JSON.stringify(profile));}catch(_){}});
      const list=document.getElementById('savedShelves');
      const listHeading=document.getElementById('savedShelvesHeading');
      function readShelves(){
        try {
          return window.AuroraEstantesSalvas.read().filter(shelf=>shelf?.id);
        } catch { return []; }
      }
      const savedShelves=readShelves();
      listHeading.hidden=!savedShelves.length;
      list.hidden=!savedShelves.length;
      savedShelves.slice().reverse().forEach(shelf=>{
        const button=document.createElement('button');
        button.className='config-option';button.type='button';
        button.innerHTML='<span class="config-option-icon" aria-hidden="true">▤</span><span class="config-option-text"><strong></strong><small>Continuar montando esta estante</small></span><span class="config-arrow" aria-hidden="true">›</span>';
        button.querySelector('strong').textContent=shelf.name||'Minha estante';
        button.querySelector('small').textContent=shelf.published ? 'Na biblioteca · Editar estante' : 'Rascunho · Continuar montando';
        button.addEventListener('click',()=>location.href='./nova-estante.html?id='+encodeURIComponent(shelf.id));
        list.append(button);
      });
      document.getElementById('newShelf').addEventListener('click', () => {
        location.href = './nova-estante.html?nova=1';
      });
      document.getElementById('customizeShelf').addEventListener('click', () => {
        const latest=savedShelves[savedShelves.length-1];
        location.href = latest?'./nova-estante.html?id='+encodeURIComponent(latest.id):'./nova-estante.html?nova=1';
      });
    })();
  </script>
</body>
</html>
